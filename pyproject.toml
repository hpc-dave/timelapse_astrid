[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "babylapse"
version = "0.1.0"
description = "Merge face-aligned 10 s clips from many baby videos into one chronological timelapse."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
babylapse = "babylapse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
